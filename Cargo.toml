[package]
name = "subcontext"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.23.0", features = ["v4"] }

[dev-dependencies]
rusqlite = { version = "0.39.0", features = ["bundled"] }

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure git is available
        run: git --version

      - name: Configure git for tests
        run: |
          git config --global user.email "ci@test"
          git config --global user.name "CI"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Dolt
        run: |
          curl -fsSL https://github.com/dolthub/dolt/releases/download/v1.85.0/dolt-linux-amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin --strip-components=2 dolt-linux-amd64/bin/dolt
          dolt version

      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test
